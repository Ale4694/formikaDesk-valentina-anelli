name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Pubblica come bozza'
        type: boolean
        default: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust-targets: ''
            tauri-args: ''
          - platform: windows-latest
            rust-targets: ''
            tauri-args: ''
          - platform: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri-args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AutoParts Gestionale v__VERSION__'
          releaseBody: |
            ## AutoParts Gestionale v__VERSION__

            Gestionale desktop per officine e rivenditori di ricambi auto.

            ### Download

            | Piattaforma | File |
            |-------------|------|
            | Windows     | `.msi` (installer) o `.exe` (NSIS) |
            | Linux       | `.deb` (Debian/Ubuntu) o `.AppImage` |
            | macOS       | `.dmg` (Intel + Apple Silicon) |

            ### Note installazione
            - **Windows**: eseguire il file `.msi` o `.exe`
            - **Linux**: `sudo dpkg -i autoparts-manager_*.deb` oppure rendere eseguibile l'AppImage
            - **macOS**: aprire il `.dmg` e trascinare l'app in Applicazioni (se compare avviso di sicurezza: Impostazioni → Privacy e sicurezza → Apri comunque)

            Vedi [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) per i dettagli delle modifiche.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          args: ${{ matrix.tauri-args }}

  publish-latest-json:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Vedi https://github.com/${REPO}/releases/tag/${TAG} per i dettagli.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "url": "${BASE}/autoparts-manager_${VERSION}_amd64.AppImage",
                "signature": ""
              },
              "windows-x86_64": {
                "url": "${BASE}/autoparts-manager_${VERSION}_x64-setup.exe",
                "signature": ""
              },
              "darwin-universal": {
                "url": "${BASE}/autoparts-manager_${VERSION}_universal.dmg",
                "signature": ""
              }
            }
          }
          EOF

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} latest.json --clobber
