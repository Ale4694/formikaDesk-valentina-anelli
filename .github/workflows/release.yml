name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Pubblica come bozza'
        type: boolean
        default: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust-targets: ''
            tauri-args: ''
          - platform: windows-latest
            rust-targets: ''
            tauri-args: '--bundles nsis'
          - platform: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri-args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cache Tauri bundlers (NSIS) — Windows
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\tauri\NSIS
            ${{ env.LOCALAPPDATA }}\tauri\WiX
          key: tauri-bundlers-${{ runner.os }}-v1

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AutoParts Gestionale v__VERSION__'
          releaseBody: |
            ## AutoParts Gestionale v__VERSION__

            Gestionale desktop per officine e rivenditori di ricambi auto.

            ### Download

            | Piattaforma | File |
            |-------------|------|
            | Windows     | `.exe` (NSIS installer) |
            | Linux       | `.deb` (Debian/Ubuntu) o `.AppImage` |
            | macOS       | `.dmg` (Intel + Apple Silicon) |

            ### Note installazione
            - **Windows**: eseguire il file `.exe`
            - **Linux**: `sudo dpkg -i autoparts-manager_*.deb` oppure rendere eseguibile l'AppImage
            - **macOS**: aprire il `.dmg` e trascinare l'app in Applicazioni (se compare avviso di sicurezza: Impostazioni → Privacy e sicurezza → Apri comunque)

            Vedi [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) per i dettagli delle modifiche.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          args: ${{ matrix.tauri-args }}

  publish-latest-json:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build latest.json from signed release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          PRODUCT=$(jq -r '.productName' src-tauri/tauri.conf.json | tr ' ' '.')
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Download all .sig files uploaded by tauri-action during the build
          mkdir -p /tmp/sigs
          gh release download "${TAG}" --repo "${REPO}" --pattern "*.sig" --dir /tmp/sigs 2>/dev/null || true

          echo "Sig files found:"
          ls /tmp/sigs/ 2>/dev/null || echo "(none — signing key may not have been set)"

          # Find the .sig file matching a pattern and read its content
          find_sig() {
            local pattern="$1"
            ls /tmp/sigs/ 2>/dev/null | grep -iE "$pattern" | head -1
          }

          LINUX_SIG_FILE=$(find_sig "amd64.*appimage|appimage.*amd64")
          WIN_SIG_FILE=$(find_sig "x64-setup|nsis")
          MAC_SIG_FILE=$(find_sig "universal|darwin|macos")

          read_sig() {
            local f="/tmp/sigs/${1}"
            [ -n "$1" ] && [ -f "$f" ] && cat "$f" || echo ""
          }

          # URL = BASE + package name (sig filename without the trailing .sig)
          pkg_url() {
            local sigfile="$1"
            local fallback="$2"
            if [ -n "$sigfile" ]; then
              echo "${BASE}/${sigfile%.sig}"
            else
              echo "${BASE}/${fallback}"
            fi
          }

          LINUX_SIG=$(read_sig "$LINUX_SIG_FILE")
          LINUX_URL=$(pkg_url "$LINUX_SIG_FILE" "${PRODUCT}_${VERSION}_amd64.AppImage.tar.gz")

          WIN_SIG=$(read_sig "$WIN_SIG_FILE")
          WIN_URL=$(pkg_url "$WIN_SIG_FILE" "${PRODUCT}_${VERSION}_x64-setup.nsis.zip")

          MAC_SIG=$(read_sig "$MAC_SIG_FILE")
          MAC_URL=$(pkg_url "$MAC_SIG_FILE" "${PRODUCT}_${VERSION}_universal.app.tar.gz")

          jq -n \
            --arg version  "$VERSION" \
            --arg notes    "Vedi https://github.com/${REPO}/releases/tag/${TAG} per i dettagli." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg linux_url  "$LINUX_URL" \
            --arg linux_sig  "$LINUX_SIG" \
            --arg win_url    "$WIN_URL" \
            --arg win_sig    "$WIN_SIG" \
            --arg mac_url    "$MAC_URL" \
            --arg mac_sig    "$MAC_SIG" \
            '{
              version:  $version,
              notes:    $notes,
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64":    { url: $linux_url, signature: $linux_sig },
                "windows-x86_64":  { url: $win_url,   signature: $win_sig   },
                "darwin-universal": { url: $mac_url,  signature: $mac_sig   }
              }
            }' > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} latest.json --clobber
